name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: true
  test:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up npm
        run: npm install --global npm@11.19.0
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check Peer Dependencies
        run: node dist/cli.js
