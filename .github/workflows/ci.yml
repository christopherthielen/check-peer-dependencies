name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    needs: [test, package-compatibility]
    runs-on: ubuntu-latest
    steps:
      - run: true
  test:
    name: Tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up npm
        run: npm install --global npm@11.19.0
      - name: Install Dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: Run Security and Downstream Tests
        run: npm test
      - name: Save Failed Downstream Projects
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/peer-downstream-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Peer Dependencies
        run: node dist/cli.js
      - name: Pack Consumer Artifact
        if: runner.os == 'Linux'
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: npm-package
          path: ${{ runner.temp }}/check-peer-dependencies-*.tgz
          if-no-files-found: error
  package-compatibility:
    name: Packed CLI (Node ${{ matrix.node }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [10, 14, 22, 24]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Packed Package
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install ../package/*.tgz --no-audit --no-fund
      - name: Check CommonJS API and CLI
        working-directory: consumer
        run: |
          node -e "require('assert').strictEqual(typeof require('check-peer-dependencies').checkPeerDependencies, 'function')"
          node -e "for (const name of ['typescript', 'oxfmt', 'lint-staged', 'yarn']) require('assert').strictEqual(require('fs').existsSync('node_modules/' + name), false)"
          ./node_modules/.bin/check-peer-dependencies
      - name: Check ESM Interoperability
        if: matrix.node != 10
        working-directory: consumer
        run: node --input-type=module -e "import { checkPeerDependencies } from 'check-peer-dependencies'; import assert from 'assert'; assert.strictEqual(typeof checkPeerDependencies, 'function')"
